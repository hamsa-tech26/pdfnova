name: Search Readiness and Discovery Watch

on:
  pull_request:
    branches: [main]
    paths:
      - "app/sitemap.ts"
      - "scripts/indexNowRoutes.mjs"
      - "scripts/auditSearchReadiness.mjs"
      - "scripts/__tests__/searchReadiness.test.mjs"
      - ".github/workflows/search-readiness.yml"
  workflow_dispatch:
  schedule:
    # Fridays at 07:41 India time (02:11 UTC); no paid external service.
    - cron: "11 2 * * 5"

permissions:
  contents: read

jobs:
  public-search-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install the exact test lockfile without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify route parity, read-only requests, and metadata regression detection
        run: npx vitest run scripts/__tests__/searchReadiness.test.mjs
      - name: Verify live public HTML, canonical tags, sitemap, and internal links
        if: github.event_name != 'pull_request'
        run: node scripts/auditSearchReadiness.mjs
      - name: Keep seven days of public metadata-only receipts
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kukureku-search-readiness
          path: benchmarks/website/reports/search-readiness.json
          retention-days: 7
          if-no-files-found: warn
