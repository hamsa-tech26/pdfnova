name: Task 285 Image Fallback and Object URL Cleanup
on:
  push:
    branches: [test/task285-image-fallback-path]
    paths:
      - "e2e/task285-image-fallback-path.local.mjs"
      - "playwright.task285-image-fallback-path.config.mjs"
      - ".github/workflows/task285-image-fallback-path.yml"
      - "vercel.json"
  pull_request:
    branches: [fix/task284-image-decoded-pixel-limit]
    paths:
      - "e2e/task285-image-fallback-path.local.mjs"
      - "playwright.task285-image-fallback-path.config.mjs"
      - ".github/workflows/task285-image-fallback-path.yml"
      - "vercel.json"
permissions:
  contents: read
concurrency:
  group: task285-image-fallback-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify browser-local Image fallback and object URL cleanup
        run: npx playwright test --config=playwright.task285-image-fallback-path.config.mjs
        env:
          TASK285_BROWSER: ${{ matrix.browser }}
          NEXT_TELEMETRY_DISABLED: 1
