name: Production WebKit PDF Page Integrity Acceptance

on:
  pull_request:
    branches: [integration/task244-output-integrity-gates]
    paths:
      - "e2e/production-page-integrity.live.mjs"
      - "playwright.page-integrity-webkit.config.mjs"
      - ".github/workflows/production-pdf-page-webkit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-page-webkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-webkit-page-fidelity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @playwright/test@1.56.1
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.6
      - run: npx playwright install --with-deps webkit
      - name: Verify Merge, Split, Extract, Delete, Rotate and Organize downloads in WebKit
        run: npx playwright test --config=playwright.page-integrity-webkit.config.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: task245-synthetic-webkit-page-integrity-failure
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
