name: Production WebKit PDF Visual Outputs Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "e2e/production-watermark-visual.live.mjs"
      - "e2e/production-visual-signature.live.mjs"
      - "playwright.visual-webkit-production.config.mjs"
      - ".github/workflows/production-visual-webkit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-visual-webkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-live-webkit-visual-pdfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @playwright/test@1.56.1
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.6
      - run: npx playwright install --with-deps webkit
      - name: Inspect actual WebKit watermark and selected-page signature PDFs
        run: npx playwright test --config=playwright.visual-webkit-production.config.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: task248-synthetic-webkit-visual-pdf-failure
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
