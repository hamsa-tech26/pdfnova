name: Validate

on:
  push:
    branches: [main, prelaunch-brand-transition]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:tools
      - run: npm run check:output-evidence
      - run: npm run lint
      - run: npm test
      - run: npm run check:output-evidence -- --require-complete
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
