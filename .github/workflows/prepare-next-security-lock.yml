name: Prepare Next.js security lockfile
on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/prepare-next-security-lock.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-next-security-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  refresh-and-verify-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Regenerate lockfile for the pinned patched Next.js version
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean lockfile installation
        run: npm ci --no-audit --no-fund
      - name: Verify patched Next.js dependency tree and audit
        run: |
          npm ls next eslint-config-next @next/env @next/eslint-plugin-next
          npm audit --audit-level=moderate
      - name: Commit the generated lockfile to this draft branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
          else
            git commit -m "chore(deps): refresh lockfile for Next.js 16.4.6"
            git push origin "HEAD:${HEAD_REF}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nextjs-16.4.6-security-lockfile
          path: package-lock.json
          retention-days: 3
          if-no-files-found: error
