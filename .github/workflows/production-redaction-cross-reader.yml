name: Production Redaction Cross-Reader Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "e2e/production-redaction-poppler.live.mjs"
      - "playwright.redaction-production.config.mjs"
      - ".github/workflows/production-redaction-cross-reader.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-redaction-cross-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  redaction-cross-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @playwright/test@1.56.1
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.6
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npx playwright install --with-deps chromium
      - name: Verify live redaction PDF bytes under Poppler and PyMuPDF
        run: npx playwright test --config=playwright.redaction-production.config.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: task225-synthetic-redaction-failure
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
