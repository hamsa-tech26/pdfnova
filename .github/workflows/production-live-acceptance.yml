name: Production Live PDF-to-Excel Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "e2e/production-live-acceptance.live.mjs"
      - "playwright.live-production.config.mjs"
      - ".github/workflows/production-live-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-production-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify-live-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Validate current LIVE production site with private-in-run synthetic files only
        run: npx playwright test --config=playwright.live-production.config.mjs
      - name: Preserve test traces on failure only (synthetic, never user uploads)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-synthetic-pdf-to-xlsx-failure
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
