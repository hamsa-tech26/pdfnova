name: Refresh Next.js Security Lockfile

on:
  push:
    branches:
      - feature/kukureku-motion-system-v1
    paths:
      - package.json
      - .github/workflows/refresh-next-security-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: next-security-lockfile-{{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/kukureku-motion-system-v1
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit complete dependency tree
        run: npm audit --audit-level=moderate
      - name: Run lint and unit tests
        run: |
          npm run lint
          npm test
      - name: Run tool registry and output evidence checks
        run: |
          npm run check:tools
          npm run check:output-evidence
      - name: Build production application
        run: npm run build
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh Next.js security lockfile"
          git push origin HEAD:feature/kukureku-motion-system-v1
