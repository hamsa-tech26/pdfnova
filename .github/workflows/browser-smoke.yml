name: Browser Reliability Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install pinned Playwright release-test dependency
        run: npm install --no-save @playwright/test@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser reliability smoke suite, all 30 tool routes, and mobile baseline
        run: npx playwright test --config=playwright.config.mjs

      - name: Preserve non-sensitive browser-loading baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-mobile-baseline
          path: benchmarks/website/reports/mobile-browser-baseline.json
          retention-days: 14
          if-no-files-found: warn
