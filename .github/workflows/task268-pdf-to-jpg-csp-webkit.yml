name: Task 268 PDF-to-JPG CSP Observation (WebKit)
on:
  pull_request:
    branches: [main, research/task267-pdf-to-word-csp]
    paths:
      - "e2e/production-csp-task268-pdf-to-jpg.live.mjs"
      - "playwright.task268-csp-webkit.config.mjs"
      - ".github/workflows/task268-pdf-to-jpg-csp-webkit.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: task268-pdf-to-jpg-csp-webkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inspect-pdf-to-jpg-csp-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps webkit
      - name: Verify synthetic JPG ZIP output, cancellation and direct egress under report-only CSP
        run: npx playwright test --config=playwright.task268-csp-webkit.config.mjs
