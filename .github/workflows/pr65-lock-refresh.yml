name: PR65 One-Time Secure Lockfile Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/pr65-lock-refresh.yml

# Temporary and branch-restricted. Remove after the lockfile is committed.
permissions:
  contents: write

jobs:
  refresh-lock:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.number == 65 &&
      github.event.pull_request.head.ref == 'feature/kukureku-pdf-to-excel-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exactly the authorized draft branch
        uses: actions/checkout@v4
        with:
          ref: feature/kukureku-pdf-to-excel-v1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate npm lockfile using registry metadata, without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --no-progress
      - name: Verify patched Next.js pins in manifest and lockfile
        run: |
          node - <<'NODE'
          const p=require('./package.json');
          const lock=require('./package-lock.json');
          for(const key of ['next','eslint-config-next']){
            const declared=p.dependencies?.[key] ?? p.devDependencies?.[key];
            if(declared !== '16.3.8' || lock.packages['node_modules/'+key]?.version !== '16.3.8'){
              throw new Error('Pinned/locked dependency is not patched: '+key);
            }
          }
          console.log('Both Next.js packages securely resolved at 16.3.8');
          NODE
      - name: Commit only regenerated package lock to draft branch
        env:
          BRANCH: feature/kukureku-pdf-to-excel-v1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
          else
            git commit -m "chore(security): regenerate lockfile for patched Next.js 16.3.8"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
