name: Production Watermark PDF Output Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "e2e/production-watermark-visual.live.mjs"
      - "playwright.watermark-production.config.mjs"
      - ".github/workflows/production-watermark-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-watermark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-watermark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @playwright/test@1.56.1
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.6
      - run: npx playwright install --with-deps chromium
      - name: Inspect downloaded watermark PDF visual and text geometry
        run: npx playwright test --config=playwright.watermark-production.config.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: task246-synthetic-watermark-qa-failure
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
