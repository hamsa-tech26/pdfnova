name: Release 57 XLSX Browser Roundtrip
on:
  pull_request:
    branches: [main, fix/task169-vitest-security]
    paths:
      - "lib/converters/pdfToXlsx.ts"
      - "lib/converters/pdfToXlsxQuality.ts"
      - "lib/pdf-engine-v4/**"
      - "app/(workspace)/pdf-to-excel/**"
      - "e2e/pdf_to_excel.e2e.mjs"
      - "playwright.xlsx.config.mjs"
      - ".github/workflows/release57-xlsx.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Real browser PDF input to XLSX download and ZIP assertion
        run: npx playwright test --config=playwright.xlsx.config.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release57-browser-failure
          path: test-results/
          retention-days: 7
