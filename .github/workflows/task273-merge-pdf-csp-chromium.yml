name: Task 273 Merge PDF CSP Observation (Chromium)
on:
  pull_request:
    branches: [main, research/task272-protect-unlock-csp]
    paths:
      - "e2e/production-csp-task273-merge-pdf.live.mjs"
      - "playwright.task273-csp-chromium.config.mjs"
      - ".github/workflows/task273-merge-pdf-csp-chromium.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: task273-merge-pdf-csp-chromium-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inspect-merge-pdf-csp:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify merged PDF page order, independent text and direct egress under report-only CSP
        run: npx playwright test --config=playwright.task273-csp-chromium.config.mjs
