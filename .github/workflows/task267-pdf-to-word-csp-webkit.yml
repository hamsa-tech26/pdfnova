name: Task 267 PDF-to-Word CSP Observation (WebKit)
on:
  pull_request:
    branches: [main]
    paths:
      - "e2e/production-csp-task267-pdf-to-word.live.mjs"
      - "playwright.task267-csp-webkit.config.mjs"
      - ".github/workflows/task267-pdf-to-word-csp-webkit.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: task267-pdf-to-word-csp-webkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inspect-pdf-to-word-csp-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps webkit
      - name: Verify synthetic PDF-to-Word output and direct egress under report-only CSP
        run: npx playwright test --config=playwright.task267-csp-webkit.config.mjs
