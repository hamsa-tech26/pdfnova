name: Task 289 Abortable PDF FileReader
on:
  push:
    branches: [fix/task289-abortable-pdf-file-read]
    paths:
      - "app/(workspace)/add-image-stamp-pdf/page.tsx"
      - "app/(workspace)/sign-pdf/page.tsx"
      - "lib/pdf/readFileAsArrayBuffer.ts"
      - "e2e/task289-abortable-pdf-file-read.local.mjs"
      - "playwright.task289-abortable-pdf-file-read.config.mjs"
      - ".github/workflows/task289-abortable-pdf-file-read.yml"
      - "vercel.json"
  pull_request:
    branches: [test/task288-pdf-selection-reset-cancellation]
    paths:
      - "app/(workspace)/add-image-stamp-pdf/page.tsx"
      - "app/(workspace)/sign-pdf/page.tsx"
      - "lib/pdf/readFileAsArrayBuffer.ts"
      - "e2e/task289-abortable-pdf-file-read.local.mjs"
      - "playwright.task289-abortable-pdf-file-read.config.mjs"
      - ".github/workflows/task289-abortable-pdf-file-read.yml"
      - "vercel.json"
permissions:
  contents: read
concurrency:
  group: task289-abortable-pdf-read-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @playwright/test@1.56.1
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.6
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify FileReader abort on reset and fresh PDF recovery
        run: npx playwright test --config=playwright.task289-abortable-pdf-file-read.config.mjs
        env:
          TASK289_BROWSER: ${{ matrix.browser }}
          NEXT_TELEMETRY_DISABLED: 1
