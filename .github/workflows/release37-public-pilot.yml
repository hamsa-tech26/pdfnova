name: Engine V4 Public Document Pilot

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/downloadRelease37PublicPilot.mjs"
      - "e2e/release37_public.pilot.mjs"
      - "playwright.pilot.config.mjs"
      - "benchmarks/release37/**"
      - "scripts/createRelease37ReviewQueue.mjs"
      - "scripts/checkRelease37PublicTableInventory.mjs"
      - "scripts/release85BlindAgreement.mjs"
      - "scripts/compareRelease85BlindAnnotations.mjs"
      - "scripts/prepareRelease85BlindPair.mjs"
      - "scripts/__tests__/release85BlindAgreement.nodecheck.mjs"
      - "scripts/collectRelease37Corpus.mjs"
      - "scripts/checkRelease37XlsxReader.py"
      # Any OCR/table detection/export change must rerun actual publisher PDFs.
      - "lib/pdf-engine-v4/ocr/**"
      - "lib/pdf-engine-v4/analysis/**"
      - "lib/pdf-engine-v4/pipeline/**"
      - "lib/converters/**"
      - "benchmarks/release107/**"
      - ".github/workflows/release37-public-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release37-public-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  published-document-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Release 85 double-blind comparison safety tests (synthetic fixtures only)
        run: npm run test:v4:blind-pair
      - name: Install independent XLSX workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium

      - name: Confirm formal V4 Stable gate remains BLOCKED without real-world evidence
        run: |
          node --input-type=module -e '
          import {readFileSync} from "node:fs";
          import {checkRelease37Gate} from "./scripts/checkRelease37Gate.mjs";
          const report = JSON.parse(readFileSync("benchmarks/release37/report.json", "utf8"));
          const outcome = checkRelease37Gate(report);
          console.log(JSON.stringify({formalV4Gate:outcome.status, acceptedDocuments:outcome.documentCount, failureCount:outcome.failures.length}));
          if (outcome.status !== "BLOCKED" || outcome.documentCount !== 0) process.exit(1);
          '

      - name: Download three real USGS sources to ephemeral runner and derive bounded excerpts
        run: node scripts/downloadRelease37PublicPilot.mjs

      - name: Cross-check actual USGS source hash and all five unreviewed table locations
        run: |
          node scripts/checkRelease37PublicTableInventory.mjs
          node scripts/checkRelease37PublicTableInventory.mjs benchmarks/release37/private/usgs-ofr20241025-metadata.json

      - name: Analyze each actual publisher PDF in Chromium V4 Inspector
        run: npx playwright test --config=playwright.pilot.config.mjs

      - name: Prepare incomplete external reviewer queue (zero accepted documents)
        run: |
          node scripts/createRelease37ReviewQueue.mjs
          node --input-type=module -e '
          import {readFileSync} from "node:fs";
          const q=JSON.parse(readFileSync("benchmarks/release37/reports/review-queue.json","utf8"));
          if(q.pilotCount!==3||q.acceptedDistinctRealDocuments!==0||
             q.queue.some(x=>x.rightsConfirmed!==false||x.independentReferenceReview!==false||x.acceptedDocumentCredit!==0))
             process.exit(1);
          '

      # Deliberately exclude source PDF bytes and raw text/Inspector output.
      - name: Upload bounded metadata-only diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release37-three-publication-diagnostics
          path: |
            benchmarks/release37/reports/*-diagnostic.json
            benchmarks/release37/reports/review-queue.json
            benchmarks/release37/private/*-metadata.json
          retention-days: 7
          if-no-files-found: warn
