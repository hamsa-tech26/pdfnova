name: Issue 112 offline alignment preflight

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/verifyPubTablesAlignment.py
      - scripts/__tests__/pubtablesAlignment_test.py
      - benchmarks/issue112/**
      - .github/workflows/issue112-alignment.yml

permissions:
  contents: read

jobs:
  synthetic-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.6 Pillow==12.3.0
      - run: python -m unittest discover -s scripts/__tests__ -p pubtablesAlignment_test.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/__tests__/release112Detection.nodecheck.mjs
