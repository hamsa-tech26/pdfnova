name: Weekly Dependency Security Watch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/weekly-dependency-security.yml"
  workflow_dispatch:
  schedule:
    # Mondays at 07:49 India time (02:19 UTC), away from GitHub's busiest minute.
    - cron: "19 2 * * 1"

permissions:
  contents: read

jobs:
  read-only-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install exact lockfile without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirm Next.js and Vite pinned security baselines
        run: |
          node scripts/checkNextSecurityBaseline.mjs
          node scripts/checkViteSecurityBaseline.mjs
      - name: Fail on any moderate, high or critical npm advisory
        run: npm audit --audit-level=moderate
      - name: Separately audit production dependencies
        if: always()
        run: npm audit --omit=dev --audit-level=high
