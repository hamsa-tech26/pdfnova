name: PR65 Dependency Replacement Probe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-probe:
    if: github.event.pull_request.number == 65 || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify reproducible current dependency installation
        run: npm ci --no-audit --no-fund
      - name: Capture affected dependency ancestry
        run: |
          npm explain braces
          npm explain sprintf-js
      - name: Test whether removing Next ESLint preset clears high advisory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr65"
          npm pkg delete devDependencies.eslint-config-next
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --json > "$RUNNER_TEMP/pr65/audit-without-next-eslint.json" || true
          node - <<'NODE'
          const fs = require('node:fs');
          const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pr65/audit-without-next-eslint.json','utf8'));
          console.log('Residual vulnerabilities after experimental removal:', JSON.stringify(data.metadata?.vulnerabilities));
          console.log('braces still present:', Boolean(data.vulnerabilities?.braces));
          console.log('sprintf-js still present:', Boolean(data.vulnerabilities?.['sprintf-js']));
          NODE
          git checkout -- package.json package-lock.json
      - name: Test alternative modern ESLint stack with full lint
        shell: bash
        run: |
          set -euo pipefail
          npm pkg delete devDependencies.eslint-config-next
          npm install --save-dev @eslint/js@^9 typescript-eslint eslint-plugin-react-hooks eslint-plugin-react eslint-plugin-jsx-a11y globals --no-audit --no-fund
          cat > eslint.config.mjs <<'ESLINT'
          import eslint from '@eslint/js';
          import tseslint from 'typescript-eslint';
          import hooks from 'eslint-plugin-react-hooks';
          import react from 'eslint-plugin-react';
          import jsxA11y from 'eslint-plugin-jsx-a11y';
          import globals from 'globals';
          export default tseslint.config(
            { ignores: ['.next/**','out/**','build/**','next-env.d.ts','public/qpdf/qpdf.js'] },
            eslint.configs.recommended,
            ...tseslint.configs.recommended,
            {
              files: ['**/*.{js,jsx,ts,tsx,mjs}'],
              languageOptions: { globals: { ...globals.browser, ...globals.node } },
              plugins: { 'react-hooks': hooks, react, 'jsx-a11y': jsxA11y },
              rules: {
                ...hooks.configs.recommended.rules,
                ...jsxA11y.configs.recommended.rules,
                'react/react-in-jsx-scope': 'off'
              }
            }
          );
          ESLINT
          npm run lint
          npm audit --audit-level=high
          git checkout -- package.json package-lock.json eslint.config.mjs
      - name: Test dependency-free argparse 2 for Mammoth
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          git checkout -- package.json package-lock.json eslint.config.mjs
          npm pkg set 'overrides.mammoth.argparse=2.0.1'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm explain sprintf-js || true
          npm audit --omit=dev --audit-level=high
          node -e "const m=require('mammoth'); if(typeof m.convertToHtml!=='function')process.exit(1); console.log('Mammoth browser conversion API available')"
          if [ -x node_modules/.bin/mammoth ]; then node_modules/.bin/mammoth --help > /dev/null; fi
          git checkout -- package.json package-lock.json eslint.config.mjs
      - name: Check production advisory separately
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/pr65/production-audit.json" || true
          node - <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pr65/production-audit.json','utf8'));
          console.log('Production audit severities:',JSON.stringify(data.metadata?.vulnerabilities));
          console.log('Mammoth route:',Boolean(data.vulnerabilities?.['sprintf-js']));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr65-dependency-replacement-probe
          path: ${{ runner.temp }}/pr65/*.json
          retention-days: 3
