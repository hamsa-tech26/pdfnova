name: Production WebKit PDF-to-Excel Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "e2e/production-webkit-xlsx.live.mjs"
      - "playwright.webkit-production.config.mjs"
      - ".github/workflows/production-webkit-xlsx.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-webkit-xlsx-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-public-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @playwright/test@1.56.1
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - run: npx playwright install --with-deps webkit
      - name: Verify the already-deployed public converter in Playwright WebKit
        run: npx playwright test --config=playwright.webkit-production.config.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: task224-webkit-synthetic-failure
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
